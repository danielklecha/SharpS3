name: Test pull request
permissions:
  contents: read

on:
  pull_request:
    branches:
      - "master"
      - "main"
      - "v[0-9]*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore SharpS3.slnx
    - name: Build
      run: dotnet build SharpS3.slnx --configuration Release --no-restore
    - name: Test
      run: dotnet test SharpS3.slnx --configuration Release --no-build /p:CollectCoverage=true /p:CoverletOutput=${{ github.workspace }}/CoverageResults/coverage /p:MergeWith=${{ github.workspace }}/CoverageResults/coverage.json /p:CoverletOutputFormat=\"json,lcov\"
    - name: Publish coverage report to coveralls.io   
      uses: coverallsapp/github-action@v2
      continue-on-error: true
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }} 
        file: CoverageResults/coverage.info 
